<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" role="img" aria-labelledby="title desc">
  <title id="title">Justin Praßl — software, design, systems</title>
  <desc id="desc">A dark portfolio-inspired developer profile banner with a fine grid, cyan-violet glow and the original interface-to-cloud visualization.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#060B0E"/>
      <stop offset="0.54" stop-color="#080A10"/>
      <stop offset="1" stop-color="#0A0811"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#33D6EA"/>
      <stop offset="0.54" stop-color="#89AAFF"/>
      <stop offset="1" stop-color="#B68AF4"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#12171E"/>
      <stop offset="1" stop-color="#0C1016"/>
    </linearGradient>
    <radialGradient id="cyanWash" cx="0%" cy="21%" r="88%">
      <stop offset="0%" stop-color="#047788" stop-opacity=".22"/>
      <stop offset="52%" stop-color="#07454D" stop-opacity=".065"/>
      <stop offset="100%" stop-color="#041014" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="violetWash" cx="100%" cy="8%" r="81%">
      <stop offset="0%" stop-color="#7443B4" stop-opacity=".21"/>
      <stop offset="55%" stop-color="#24143C" stop-opacity=".06"/>
      <stop offset="100%" stop-color="#120A1D" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M 36 0 L 0 0 0 36" fill="none" stroke="#7D9CA7" stroke-opacity=".095" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
  </defs>
  <rect width="1200" height="380" rx="22" fill="url(#bg)"/>
  <rect width="1200" height="380" rx="22" fill="url(#cyanWash)"/>
  <rect width="1200" height="380" rx="22" fill="url(#violetWash)"/>
  <rect width="1200" height="380" rx="22" fill="url(#grid)"/>
  <circle cx="1042" cy="54" r="185" fill="#8D56D9" opacity=".18" filter="url(#glow)"/>
  <circle cx="894" cy="315" r="140" fill="#1BC6E0" opacity=".11" filter="url(#glow)"/>
  <rect x=".75" y=".75" width="1198.5" height="378.5" rx="21" fill="none" stroke="#63747E" stroke-opacity=".25" stroke-width="1.5"/>

  <!-- Editorial section marker -->
  <rect x="67" y="47" width="7" height="7" rx="2" fill="#4DD8E9"/>
  <text x="88" y="55" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" letter-spacing="2.1" fill="#8B9BA6">PERSONAL / PROFILE_001</text>
  <path d="M 66 75 H 570" stroke="#78909E" stroke-opacity=".21"/>

  <!-- Name -->
  <text x="65" y="174" font-family="Inter, Arial, Helvetica, sans-serif" font-size="82" font-weight="750" letter-spacing="-4" fill="#F4F6FA">Justin</text>
  <text x="65" y="257" font-family="Inter, Arial, Helvetica, sans-serif" font-size="82" font-weight="750" letter-spacing="-4" fill="#F4F6FA">Praßl<tspan fill="url(#accent)">.</tspan></text>
  <rect x="67" y="276" width="68" height="4" rx="2" fill="url(#accent)"/>
  <text x="67" y="306" font-family="Inter, Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#9EA8B7">Software should feel effortless.</text>
  <text x="67" y="331" font-family="Inter, Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#9EA8B7">Building it takes intention.</text>

  <!-- Linking scaffold -->
  <path d="M 622 62 V 315" stroke="#718392" stroke-opacity=".22" stroke-dasharray="4 8"/>
  <path d="M 680 92 H 1126" stroke="#718392" stroke-opacity=".22"/>
  <text x="681" y="77" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" letter-spacing="1.7" fill="#8997A6">THE SPACE I WORK IN</text>

  <!-- Connection paths under cards -->
  <path d="M 1025 152 V 167 Q 1025 174 1018 174 H 984" stroke="#76CDE5" stroke-width="1.6" stroke-opacity=".58" fill="none"/>
  <path d="M 984 226 H 1018 Q 1025 226 1025 233 V 244" stroke="#A78CE3" stroke-width="1.6" stroke-opacity=".67" fill="none"/>
  <circle cx="1025" cy="166" r="3" fill="#59CCE8"/>
  <circle cx="1025" cy="237" r="3" fill="#B38BEE"/>

  <!-- Three intentional layers -->
  <g>
    <rect x="692" y="111" width="392" height="53" rx="11" fill="url(#panel)" stroke="#38BDDA" stroke-opacity=".37"/>
    <rect x="707" y="126" width="24" height="24" rx="6" fill="#30C9DF" fill-opacity=".11" stroke="#58D0E3" stroke-opacity=".37"/>
    <path d="m713 138 5-5 5 5-5 5z" fill="none" stroke="#76DCEB" stroke-width="1.5"/>
    <text x="746" y="134" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" letter-spacing="1.3" fill="#81919E">01 / EXPERIENCE</text>
    <text x="746" y="151" font-family="Inter, Arial, Helvetica, sans-serif" font-size="16" font-weight="600" fill="#EAF1F8">Interfaces &amp; design systems</text>
    <circle cx="1060" cy="137" r="4" fill="#49D1E6"/>
  </g>
  <g>
    <rect x="726" y="176" width="392" height="53" rx="11" fill="url(#panel)" stroke="#788DE9" stroke-opacity=".34"/>
    <rect x="741" y="191" width="24" height="24" rx="6" fill="#7D9CF3" fill-opacity=".13" stroke="#8CA6F0" stroke-opacity=".36"/>
    <path d="M747 198h12m-12 4h12m-12 4h8" stroke="#A3B9FF" stroke-width="1.5" stroke-linecap="round"/>
    <text x="780" y="199" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" letter-spacing="1.3" fill="#81919E">02 / PRODUCT</text>
    <text x="780" y="216" font-family="Inter, Arial, Helvetica, sans-serif" font-size="16" font-weight="600" fill="#EAF1F8">Full-stack applications</text>
    <circle cx="1094" cy="202" r="4" fill="#8BAAF1"/>
  </g>
  <g>
    <rect x="692" y="241" width="392" height="53" rx="11" fill="url(#panel)" stroke="#B78AF1" stroke-opacity=".35"/>
    <rect x="707" y="256" width="24" height="24" rx="6" fill="#B48CF0" fill-opacity=".12" stroke="#BBA1EF" stroke-opacity=".40"/>
    <path d="M712 268h14m-11-5v10m8-10v10" stroke="#C5A8F8" stroke-width="1.5" stroke-linecap="round"/>
    <text x="746" y="264" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" letter-spacing="1.3" fill="#81919E">03 / SYSTEMS</text>
    <text x="746" y="281" font-family="Inter, Arial, Helvetica, sans-serif" font-size="16" font-weight="600" fill="#EAF1F8">Cloud &amp; architecture</text>
    <circle cx="1060" cy="267" r="4" fill="#BD97F3"/>
  </g>

  <!-- Footer trace -->
  <path d="M 681 318 H 1128" stroke="#798C9C" stroke-opacity=".23"/>
  <rect x="682" y="334" width="7" height="7" rx="3.5" fill="#50D7E6"/>
  <text x="701" y="342" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" letter-spacing="1.05" fill="#9DAAB8">CURIOUS BY DEFAULT  ·  BUILDER BY CHOICE</text>
</svg>
